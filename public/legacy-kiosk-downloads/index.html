<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#008080" />
  <title>Kiosk downloads · Tavari</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      color: #111827;
      background-color: #f8f9fa;
      -webkit-font-smoothing: antialiased;
    }
    .pw-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .pw-card {
      width: 100%;
      max-width: 450px;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 2rem;
      border: 1px solid #d1d5db;
      box-shadow: 0 0 0 1px #e5e7eb, 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .pw-title { font-size: 1.25rem; font-weight: 700; color: #111827; margin: 0 0 0.75rem; }
    .pw-lead { font-size: 1rem; color: #4b5563; margin: 0 0 1.25rem; line-height: 1.45; }
    a.dl {
      display: block;
      text-align: center;
      padding: 1rem 1.25rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      background-color: #008080;
      color: #fff !important;
      text-decoration: none;
    }
    a.dl:active { opacity: 0.92; }
    .sub { font-size: 0.875rem; color: #6b7280; margin-top: 1rem; line-height: 1.45; }
    .hint { font-size: 0.8rem; color: #6b7280; margin-top: 1rem; line-height: 1.45; }
    .hint a { color: #008080; }
    .staff-toggle {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.5rem;
      font-size: 0.8rem;
      color: #6b7280;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: center;
    }
    .tech { display: none; margin-top: 0.5rem; font-size: 0.72rem; color: #9ca3af; word-break: break-all; }
    .tech.open { display: block; }
    .foot { margin-top: 2rem; font-size: 0.75rem; color: #9ca3af; text-align: center; }
    .err { color: #dc2626; font-size: 0.875rem; margin-top: 0.75rem; }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <div class="pw-container">
    <div id="app"></div>
    <p class="foot">Staff IT — older tablets</p>
  </div>
  <script src="./app.es5.js"></script>
</body>
</html>
